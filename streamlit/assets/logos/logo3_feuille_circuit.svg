<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Feuille stylisée -->
  <path d="M100 20 C140 40, 175 80, 160 130 C145 160, 110 170, 100 180
             C90 170, 55 160, 40 130 C25 80, 60 40, 100 20 Z"
        fill="#1a3a5c"/>

  <!-- Nervure centrale (tige) -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#2e6da4" stroke-width="2.5"/>

  <!-- Branches circuit gauche -->
  <line x1="100" y1="65" x2="68" y2="65" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="68" y1="65" x2="68" y2="82" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="68" cy="82" r="4" fill="#ffffff"/>

  <line x1="100" y1="90" x2="60" y2="90" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="60" y1="90" x2="60" y2="75" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="60" cy="75" r="4" fill="#4fc3f7"/>

  <line x1="100" y1="115" x2="65" y2="115" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="65" cy="115" r="4" fill="#ffffff"/>

  <!-- Branches circuit droite -->
  <line x1="100" y1="70" x2="132" y2="70" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="132" y1="70" x2="132" y2="85" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="132" cy="85" r="4" fill="#4fc3f7"/>

  <line x1="100" y1="95" x2="138" y2="95" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="138" cy="95" r="4" fill="#ffffff"/>

  <line x1="100" y1="120" x2="130" y2="120" stroke="#2e6da4" stroke-width="1.8"/>
  <line x1="130" y1="120" x2="130" y2="108" stroke="#2e6da4" stroke-width="1.8"/>
  <circle cx="130" cy="108" r="4" fill="#4fc3f7"/>

  <!-- Texte -->
  <text x="100" y="193" font-family="Arial, sans-serif" font-size="15" font-weight="700"
        fill="#1a3a5c" text-anchor="middle" letter-spacing="2">VitaIA</text>
</svg>
